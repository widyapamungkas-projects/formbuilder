name: opnform

x-api-env: &api-env
  APP_NAME: ${APP_NAME:-opnForm}
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-true}
  APP_KEY: ${APP_KEY:-}
  APP_URL: ${APP_URL:-http://localhost:8000}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE:-opnform}
  DB_USERNAME: ${DB_USERNAME:-opnform}
  DB_PASSWORD: ${DB_PASSWORD}

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-opnform}
      MYSQL_USER: ${DB_USERNAME:-opnform}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Laravel (PHP-FPM). The PHP code is bind-mounted from ./api.
  api:
    build:
      context: ./docker/api
    image: opnform-api
    restart: unless-stopped
    working_dir: /var/www/html
    environment: *api-env
    volumes:
      - ./api:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # nginx in front of PHP-FPM
  api-web:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - ./api:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  # Vite dev server with hot reload. node_modules lives in a named volume
  # (much faster than a Windows bind mount).
  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      API_PROXY_TARGET: http://api-web
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - api-web

  # Optional local Nextcloud for WebDAV integration tests.
  # Start with: .\dev.ps1 nextcloud   (profile "nextcloud")
  nextcloud:
    image: nextcloud:apache
    profiles: ["nextcloud"]
    restart: unless-stopped
    environment:
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: "localhost nextcloud"
    volumes:
      - nextcloud_data:/var/www/html
    ports:
      - "${NEXTCLOUD_PORT:-8080}:80"

volumes:
  db_data:
  frontend_node_modules:
  nextcloud_data:
